<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="上一张" title="上一张">&#10094;</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="下一张" title="下一张">&#10095;</button>
    <button class="lightbox-favorite" id="lightboxFavorite" title="{{ lightbox_favorite_title | default('收藏') }}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </button>
    <div class="lightbox-content">
        <div class="lightbox-info" id="lightboxInfo">
            <div class="lightbox-name" id="lightboxName"></div>
        </div>
        <div class="lightbox-image-container">
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
        </div>
    </div>
</div>
